<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAVISAUCE — Shell Wallet</title>
<link rel="icon" href="ravi-logo.png">
<style>
:root{
  --paper:#FFFFFF;
  --ink:#000000;
  --ink-2:#5a5a5a;
  --emerald:#0F5C45;
  --rule:rgba(0,0,0,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:'Helvetica Neue','Helvetica','Arial',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;letter-spacing:-.005em}

/* frame */
.frame{position:relative;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr;padding:clamp(18px,2.6vh,28px) clamp(28px,4vw,56px) clamp(20px,3vh,32px);gap:clamp(8px,1.6vh,20px)}

/* top */
.top{display:flex;justify-content:flex-end;align-items:center}
.top .help{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-decoration:none;font-weight:500;position:relative;padding:4px 0;transition:color .25s}
.top .help::after{content:'';position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--emerald);transition:width .45s cubic-bezier(.65,0,.35,1)}
.top .help:hover{color:var(--emerald)}
.top .help:hover::after{width:100%}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:clamp(28px,5vw,72px);min-height:0;overflow:hidden}

.stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;height:100%;overflow:visible}
.wallet-wrap{position:relative;display:block;line-height:0;max-width:100%;max-height:100%;cursor:pointer}
.wallet{width:auto;max-width:100%;max-height:min(94vh,55vw);height:auto;display:block;
  user-select:none;-webkit-user-drag:none;
}
.wallet-wrap{cursor:pointer}
.wallet-base{position:relative;z-index:1}
.wallet-hover{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;visibility:hidden;z-index:2;pointer-events:none}
.wallet-wrap.flipped .wallet-base{visibility:hidden}
.wallet-wrap.flipped .wallet-hover{visibility:visible}

/* product column */
.product{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(14px,2vh,22px);max-width:440px;text-align:left;width:100%}

.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);font-weight:500}

.title{font-size:clamp(40px,5.4vh,58px);line-height:1.02;letter-spacing:-.028em;font-weight:500;color:var(--ink)}

.lede{font-size:clamp(14px,1.7vh,16px);line-height:1.45;color:var(--ink-2);max-width:36ch;font-weight:400}
@media (max-height:660px){.lede{display:none}}

/* cta */
.cta{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(14px,1.8vh,18px);width:100%;max-width:440px;margin-top:clamp(6px,1vh,12px)}

.price-row{position:relative;display:flex;align-items:flex-end;justify-content:flex-start;gap:clamp(20px,3vw,32px);width:100%;padding-top:clamp(14px,2vh,20px)}
.price-row::before{content:'';position:absolute;top:0;left:0;width:280px;height:1px;background:var(--rule)}

.price{font-size:clamp(32px,4.4vh,44px);font-weight:500;line-height:.95;letter-spacing:-.025em;color:var(--ink)}

.buy{display:flex;align-self:flex-start;align-items:center;justify-content:center;gap:14px;width:280px;
  padding:clamp(16px,2.2vh,20px) 0;background:var(--emerald);color:var(--paper);
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;
  text-decoration:none;border:none;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .25s cubic-bezier(.2,.8,.2,1);
}
.buy::before{content:'';position:absolute;inset:0;background:var(--ink);transform:translateX(-101%);transition:transform .55s cubic-bezier(.65,0,.35,1);z-index:0}
.buy:hover::before{transform:translateX(0)}
.buy>*{position:relative;z-index:1}
.buy .arrow{transition:transform .35s}
.buy:hover .arrow{transform:translateX(6px)}

/* notify form */
.notify{width:280px;margin-top:18px}
.notify-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin-bottom:10px}
.notify-row{display:flex;border:1px solid var(--rule);transition:border-color .25s}
.notify-row:focus-within{border-color:var(--ink)}
.notify-row input{flex:1;min-width:0;padding:12px 14px;border:none;outline:none;background:transparent;font-family:inherit;font-size:13px;color:var(--ink);letter-spacing:0}
.notify-row input::placeholder{color:rgba(0,0,0,.4)}
.notify-row button{padding:12px 16px;background:var(--ink);color:var(--paper);font-family:inherit;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;border:none;cursor:pointer;transition:background .25s}
.notify-row button:hover{background:var(--emerald)}
.notify-row button:disabled{opacity:.5;cursor:wait}
.notify-status{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin-top:10px;min-height:14px}
.notify-status.ok{color:var(--emerald)}
.notify-status.err{color:#a72b1f}
.notify.success .notify-row{opacity:.5;pointer-events:none}

/* reveal */
.r{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.d1{animation-delay:.10s}.d2{animation-delay:.32s}.d3{animation-delay:.55s}.d4{animation-delay:.82s}.d5{animation-delay:1.08s}.d6{animation-delay:1.32s}.d7{animation-delay:1.58s}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.stage .wallet{opacity:0;transform:translateY(24px) scale(.97);animation:walletRise 1.4s cubic-bezier(.2,.8,.2,1) .25s forwards}
@keyframes walletRise{to{opacity:1;transform:translateY(0) scale(1)}}

/* responsive */
@media (max-width:820px){
  html,body{overflow:auto;height:auto;min-height:100%}
  .frame{display:flex;flex-direction:column;height:auto;min-height:100dvh;padding:12px 22px 24px;gap:16px}
  .top{order:3;margin-top:auto;justify-content:center;padding-top:24px;border-top:1px solid var(--rule)}
  .top .help{font-size:12px;letter-spacing:.18em}
  .hero{order:2;grid-template-columns:1fr;gap:clamp(18px,2.6vh,28px);text-align:center;align-items:start}
  .stage{order:1;width:100%;min-height:auto}
  .product{order:2;align-items:center;text-align:center;margin:0 auto;gap:14px;max-width:none;width:100%}
  .lede{max-width:36ch;margin:0 auto}
  .cta{align-items:center;max-width:none;width:100%;margin:0 auto;gap:14px}
  .price-row{justify-content:center;width:100%;padding-top:18px}
  .price-row::before{width:100%;left:0}
  .buy{width:100%;align-self:stretch;padding:20px 24px;font-size:13px;letter-spacing:.16em}
  .notify{width:100%;max-width:380px}
  .notify-label,.notify-status{text-align:left}
  .wallet{max-height:min(56vh,88vw);max-width:90vw}
}
@media (max-height:620px) and (min-width:821px){
  .lede{display:none}
  .wallet{max-height:42vh}
}
</style>
</head>
<body>

<main class="frame">

  <header class="top">
    <a href="mailto:salsadiravi@gmail.com" class="help r d1">Contact</a>
  </header>

  <section class="hero">

    <div class="stage">
      <div class="wallet-wrap" id="wallet-wrap" role="button" tabindex="0" aria-label="Click to flip wallet">
        <img class="wallet wallet-base" src="wallet-sand.png" alt="RAVISAUCE Shell bifold wallet — emerald, top grain leather, resting on sand">
        <img class="wallet wallet-hover" src="wallet-open.png" alt="" aria-hidden="true">
      </div>
    </div>

    <div class="product">

      <span class="kicker r d2">Hand-embossed bifold</span>

      <h1 class="title r d3">Shell Wallet</h1>

      <p class="lede r d4">Vegan-tanned top grain leather. Handmade and embossed by hand with the radiating ridges of a scallop shell.</p>

      <div class="cta">
        <div class="price-row r d5">
          <div class="price">$72</div>
        </div>
        <a href="https://buy.stripe.com/eVq4gBaeM5OU2SybPZ7ok04" class="buy r d6" aria-label="Buy Shell Wallet for $72">
          <span>Buy now</span>
        </a>
        <form class="notify r d7" id="notify-form" novalidate>
          <p class="notify-label">Get notified about the next drop</p>
          <div class="notify-row">
            <input type="email" name="email" placeholder="you@email.com" autocomplete="email" required>
            <button type="submit">Notify me</button>
          </div>
          <p class="notify-status" aria-live="polite"></p>
        </form>
      </div>

    </div>

  </section>

</main>

<script>
  (() => {
    const wrap = document.getElementById('wallet-wrap');
    const toggle = () => wrap.classList.toggle('flipped');
    wrap.addEventListener('click', toggle);
    wrap.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });

    const form = document.getElementById('notify-form');
    const status = form.querySelector('.notify-status');
    const button = form.querySelector('button');
    const input = form.querySelector('input[name=email]');
    const setStatus = (msg, kind) => { status.textContent = msg; status.className = 'notify-status' + (kind ? ' ' + kind : ''); };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = input.value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { setStatus('Enter a valid email', 'err'); return; }
      button.disabled = true; setStatus('Sending…');
      try {
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email}),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          form.classList.add('success');
          setStatus(data.duplicate ? "You're already on the list ✓" : "On the list ✓", 'ok');
        } else {
          setStatus(data.error || 'Could not subscribe', 'err');
          button.disabled = false;
        }
      } catch {
        setStatus('Network error', 'err');
        button.disabled = false;
      }
    });
  })();
</script>

</body>
</html>
